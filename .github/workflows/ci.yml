name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check core/ backend/ scripts/ || true

      - name: Run tests
        run: pytest tests/ -v

  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify model registry
        run: |
          if [ ! -f models/model_registry.json ]; then
            echo "WARNING: model_registry.json not found. Models not yet trained."
          else
            echo "Model registry present."
          fi
