[project]
name = "brandshield-sentinel"
version = "0.2.0"
description = "AI-powered brand impersonation detection for social accounts and mobile apps"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "backend", "backend.api", "backend.schemas", "backend.services", "backend.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
